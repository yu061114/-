<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旧影重光·时空映像馆</title>
    <meta http-equiv="refresh" content="0; url=c.html">
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF8F0 0%, #FDF5E6 100%);
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(139, 69, 19, 0.08);
        }
        .title {
            font-size: 28px;
            color: #8B4513;
            margin-bottom: 16px;
        }
        .subtitle {
            font-size: 14px;
            color: #A0826D;
            margin-bottom: 24px;
        }
        .loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #E8D5C4;
            border-top-color: #8B4513;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🏯 旧影重光·时空映像馆</div>
        <div class="subtitle">正在加载...</div>
        <div class="loading"></div>
    </div>
</body>
</html>
