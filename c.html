
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏯 旧影重光·时空映像馆</title>
    <style>
        :root {
            --primary: #8B4513;
            --accent: #D4A574;
            --bg: #FFF8F0;
            --card: #FFFFFF;
            --text: #3C2415;
            --border: #E8D5C4;
            --shadow: 0 4px 20px rgba(139,69,19,0.08);
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC','Microsoft YaHei',serif;
            background: linear-gradient(135deg, #FFF8F0 0%, #FDF5E6 50%, #FAEBD7 100%);
            color: var(--text); min-height:100vh; line-height:1.6;
        }
        .header {
            text-align:center; padding:28px 20px 16px;
            background: linear-gradient(180deg, rgba(139,69,19,0.06) 0%, transparent 100%);
            border-bottom:1px solid var(--border); position:relative;
        }
        .header h1 { font-size:28px; font-weight:700; color:var(--primary); letter-spacing:2px; }
        .header .subtitle { font-size:13px; color:#A0826D; margin-top:4px; letter-spacing:4px; }
        .header .music-badge {
            position:absolute; right:24px; top:50%; transform:translateY(-50%);
            background:var(--card); border:1px solid var(--border); border-radius:20px;
            padding:6px 16px; font-size:12px; color:var(--accent);
            display:flex; align-items:center; gap:6px; cursor:pointer;
        }
        .main-container {
            display:grid; grid-template-columns:1fr 380px; gap:20px;
            max-width:1400px; margin:0 auto; padding:20px 24px;
            min-height:calc(100vh - 160px);
        }
        @media (max-width:1024px) { .main-container { grid-template-columns:1fr; max-width:700px; } }
        .content-area { display:flex; flex-direction:column; gap:20px; }
        .card {
            background:var(--card); border-radius:var(--radius); padding:24px;
            border:1px solid var(--border); box-shadow:var(--shadow);
        }
        .card-header { font-size:17px; font-weight:600; color:var(--primary); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .step-badge {
            display:inline-flex; align-items:center; justify-content:center;
            width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff; font-size:13px; font-weight:700;
        }
        .btn {
            padding:10px 22px; border-radius:24px; font-size:14px; font-weight:500;
            cursor:pointer; border:none; transition: 0.3s; letter-spacing:1px; font-family:inherit;
        }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:#6B3410; transform:translateY(-1px); }
        .btn-outline { background:var(--card); color:var(--primary); border:1.5px solid var(--primary); }
        .btn-outline:hover { background:#FFF1E6; transform:translateY(-1px); }
        .btn-accent { background:var(--accent); color:#fff; }
        .btn-accent:hover { background:#C08D5A; transform:translateY(-1px); }
        .btn-save { background:#2E7D32; color:#fff; }
        .btn-save:hover { background:#1B5E20; transform:translateY(-1px); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; pointer-events:none; }

        .upload-actions { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
        .preview-area {
            width:100%; aspect-ratio:16/10; max-height:400px; border-radius:12px;
            background:#FAF5EF; border:2px dashed var(--border);
            display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
        }
        .preview-area img { width:100%; height:100%; object-fit:contain; }
        .placeholder { color:#C4A88B; font-size:15px; text-align:center; }

        .compare-container { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .compare-panel { text-align:center; }
        .compare-panel .label { font-size:13px; color:#888; margin-bottom:6px; }
        .compare-panel .label.after { color:#2E7D32; }
        .img-box { width:100%; aspect-ratio:4/3; border-radius:10px; background:#FAF5EF; overflow:hidden; border:1px solid var(--border); }
        .img-box img { width:100%; height:100%; object-fit:contain; }

        .season-buttons { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
        .season-btn {
            flex:1; min-width:72px; padding:10px 8px; border-radius:20px;
            font-size:14px; cursor:pointer; border:1.5px solid var(--border);
            background:var(--card); transition:0.3s; font-family:inherit; letter-spacing:1px;
        }
        .season-btn:hover { border-color:var(--accent); background:#FFFBF5; }
        .season-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 4px 12px rgba(139,69,19,0.2); }
        .season-preview {
            width:100%; aspect-ratio:16/10; max-height:380px; border-radius:12px;
            background:#FAF5EF; overflow:hidden; border:1px solid var(--border); position:relative;
        }
        .season-preview img { width:100%; height:100%; object-fit:cover; transition:opacity 0.4s; }

        .chat-panel {
            display:flex; flex-direction:column; height:fit-content;
            max-height:calc(100vh - 200px); position:sticky; top:20px;
        }
        .chat-messages {
            flex:1; overflow-y:auto; padding:8px 4px; display:flex;
            flex-direction:column; gap:10px; max-height:480px;
        }
        .chat-msg { padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.6; max-width:90%; animation:fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .chat-msg.ai { background:#FFF8F0; align-self:flex-start; border-bottom-left-radius:4px; border:1px solid #F0E0D0; }
        .chat-msg.user { background:var(--primary); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
        .chat-input-area { display:flex; gap:8px; margin-top:10px; }
        .chat-input-area input {
            flex:1; padding:10px 16px; border-radius:20px; border:1.5px solid var(--border);
            font-size:13px; outline:none; font-family:inherit;
        }
        .chat-input-area input:focus { border-color:var(--accent); }
        .footer { text-align:center; padding:12px; font-size:11px; color:#B8A088; border-top:1px solid var(--border); }
        .upgrade-tip {
            background:#FFF3E0; border:1px solid #FFE0B2; border-radius:8px;
            padding:8px 12px; font-size:12px; color:#E65100; margin-top:8px;
        }
        .loading-spinner {
            display:inline-block; width:16px; height:16px; border:2px solid #fff;
            border-radius:50%; border-top-color:transparent; animation:spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .modal-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(60,36,21,0.5); z-index:1000; justify-content:center; align-items:center;
            backdrop-filter:blur(4px);
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--card); border-radius:var(--radius); padding:28px;
            width:90%; max-width:700px; max-height:80vh; overflow-y:auto; position:relative;
        }
        .modal h3 { color:var(--primary); margin-bottom:20px; text-align:center; }
        .modal .close-btn { position:absolute; top:16px; right:20px; font-size:22px; cursor:pointer; background:none; border:none; }
        .image-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
        @media (max-width:600px) { .image-grid { grid-template-columns:repeat(2,1fr); } }
        .image-grid .img-item {
            aspect-ratio:4/3; border-radius:10px; overflow:hidden; cursor:pointer;
            border:2px solid transparent; transition:0.3s; background:#f0f0f0;
            display:flex; align-items:center; justify-content:center; position:relative;
        }
        .image-grid .img-item:hover { border-color:var(--accent); transform:scale(1.03); box-shadow:0 6px 16px rgba(0,0,0,0.12); }
        .image-grid .img-item img { width:100%; height:100%; object-fit:cover; }
        .image-grid .img-item .label {
            position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.55);
            color:#fff; font-size:11px; padding:4px 8px; text-align:center;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🏯旧影重光·时空映像馆</h1>
    <p class="subtitle">UPLOAD · RESTORE · TRANSFORM · DISCOVER</p>
    <div class="music-badge" id="musicBadge" onclick="toggleMusic()">
        <span>♪</span> 古筝悠扬 <span id="musicStatus">已暂停</span>
    </div>
</div>

<div class="main-container">
    <div class="content-area">
        <div class="card">
            <div class="card-header"><span class="step-badge">1</span> 上传古建筑照片</div>
            <div class="upload-actions">
                <button class="btn btn-primary" onclick="openLibrary()">📁 选择内置图片</button>
                <button class="btn btn-outline" onclick="triggerUpload()">📤 自行上传图片</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleUserUpload(event)">
            </div>
            <div class="preview-area" id="previewArea">
                <span class="placeholder">🏛️<br>请上传或选择一张古建筑图片</span>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><span class="step-badge">2</span> AI修复画质对比</div>
            <div style="margin-bottom:12px;">
                <button class="btn btn-accent" id="restoreBtn" disabled onclick="startRestore()">✨ 开始AI修复</button>
            </div>
            <div class="compare-container">
                <div class="compare-panel">
                    <div class="label">📷 修复前</div>
                    <div class="img-box">
                        <img id="beforeImg" src="" style="display:none;">
                        <span class="placeholder" id="beforePlaceholder">等待上传</span>
                    </div>
                </div>
                <div class="compare-panel">
                    <div class="label after">✨ 修复后</div>
                    <div class="img-box">
                        <img id="afterImg" src="" style="display:none;">
                        <span class="placeholder" id="afterPlaceholder">等待修复</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><span class="step-badge">3</span> 四季场景切换（AI 图生图）</div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px; color:#A0826D;">模型名称（从方舟控制台获取）：</label>
                <input type="text" id="modelName" 
                       value="ep-20260425092458-b9kgp" 
                       style="width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-top:4px; font-family:inherit;"
                       placeholder="例如 ep-20260425092458-b9kgp">
            </div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px; color:#A0826D;">地理位置（AI 自动识别，可手动修改）：</label>
                <input type="text" id="locationInput" 
                       style="width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-top:4px; font-family:inherit;"
                       placeholder="例如：北京市东城区故宫">
                <div id="locationStatus" style="font-size:11px; color:#8B4513; margin-top:4px;">正在识别地理位置...</div>
            </div>
            <div class="season-buttons">
                <button class="season-btn active" onclick="switchSeason('spring', this)">🌱 春</button>
                <button class="season-btn" onclick="switchSeason('summer', this)">☀️ 夏</button>
                <button class="season-btn" onclick="switchSeason('autumn', this)">🍂 秋</button>
                <button class="season-btn" onclick="switchSeason('winter', this)">❄️ 冬</button>
            </div>
            <div class="season-preview" id="seasonContainer">
                <img id="seasonImg" src="" style="display:none;">
                <span class="placeholder" id="seasonPlaceholder">请先上传图片</span>
            </div>
            <div class="upgrade-tip" id="seasonTip" style="display:none;"></div>
            <div class="upgrade-tip" style="background:#E8F5E9; border-color:#4CAF50; color:#1B5E20;">
                💡 提示：内置图库图片可以直接图生图；自行上传图片可能需要先上传到可公共访问的图床
            </div>
            <div style="margin-top:10px; text-align:center;">
                <button class="btn btn-save" id="saveBtn" onclick="saveImage()">💾 保存当前显示图片</button>
            </div>
        </div>
    </div>

<div class="chat-panel">
        <div class="card">
            <div class="card-header">🤖 时空AI助手</div>
            <div style="margin-bottom:12px;">
                <label style="font-size:13px; color:#A0826D;">AI助手模型：</label>
                <input type="text" id="chatModelName" 
                       value="ep-20260425095438-z7clv" 
                       style="width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-top:4px; font-family:inherit;"
                       placeholder="例如 ep-20260425095438-z7clv">
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="placeholder">🏛️<br>上传图片后自动分析</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="询问古建筑历史、构造..." onkeydown="if(event.key==='Enter')sendMessage()">
                <button class="btn btn-accent" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <button class="close-btn" onclick="closeLibrary()">✕</button>
        <h3>📁 选择古建筑图片</h3>
        <div class="image-grid" id="imageGrid"></div>
    </div>
</div>

<div class="footer">© 2025 旧影重光·时空映像馆 · 四季由豆包AI图生图生成</div>

<script>
const ARK_API_KEY = 'ark-fa4c2a82-1c28-4cb9-9b99-04b39f2e25a0-2795d';
const ARK_CHAT_URL = 'https://ark.cn-beijing.volces.com/api/v3/chat/completions';
const ARK_IMAGE_URL = 'https://ark.cn-beijing.volces.com/api/v3/images/generations';

const builtInImages = [
    { id: 'gugong', name: '北京故宫太和殿', url: '/-/image/a.jpg', location: '北京市东城区景山前街4号故宫博物院内' },
    { id: 'changcheng', name: '北京八达岭长城（明长城）', url: '/-/image/b.jpg', location: '北京市延庆区军都山关沟古道北口' },
    { id: 'suzhou', name: '苏州拙政园', url: '/-/image/c.jpg', location: '江苏省苏州市姑苏区东北街178号' },
    { id: 'yiheyuan', name: '北京颐和园佛香阁（建筑群）', url: '/-/image/d.jpg', location: '北京市海淀区新建宫门路19号颐和园内' },
    { id: 'pingyao', name: '山西平遥古城县衙', url: '/-/image/e.jpg', location: '山西省晋中市平遥县古城街道衙门街77号' },
    { id: 'hongcun', name: '安徽宏村承志堂', url: '/-/image/f.jpg', location: '安徽省黄山市黟县宏村镇宏村茶行弄32号' },
    { id: 'kongfu', name: '山东曲阜孔府（衍圣公府）', url: '/-/image/g.jpg', location: '山东省济宁市曲阜市鲁城街道东华门大街1号（孔庙东侧）' },
    { id: 'zhengyangmen', name: '北京正阳门箭楼', url: '/-/image/h.jpg', location: '北京市东城区前门大街甲2号' }
];

const seasonImageDB = {};

builtInImages.forEach(img => {
    seasonImageDB[img.id] = {
        spring: `https://via.placeholder.com/800x500/E8F5E9/333?text=${img.name}·春`,
        summer: `https://via.placeholder.com/800x500/E3F2FD/333?text=${img.name}·夏`,
        autumn: `https://via.placeholder.com/800x500/FFF3E0/333?text=${img.name}·秋`,
        winter: `https://via.placeholder.com/800x500/ECEFF1/333?text=${img.name}·冬`
    };
});

let currentImageData = null;
let currentBuiltInId = null;
let currentSeason = 'spring';
let isRestored = false;
let restoredImageData = null;

// Web Audio API 古筝音乐生成
let audioContext = null;
let musicPlaying = false;
let musicInterval = null;

function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playGuZhengNote(frequency, duration, delay = 0) {
    if (!audioContext) initAudio();
    
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    const filterNode = audioContext.createBiquadFilter();
    
    oscillator.connect(filterNode);
    filterNode.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.type = 'triangle';
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime + delay);
    
    filterNode.type = 'lowpass';
    filterNode.frequency.setValueAtTime(800, audioContext.currentTime + delay);
    
    gainNode.gain.setValueAtTime(0, audioContext.currentTime + delay);
    gainNode.gain.linearRampToValueAtTime(0.08, audioContext.currentTime + delay + 0.02);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + delay + duration);
    
    oscillator.start(audioContext.currentTime + delay);
    oscillator.stop(audioContext.currentTime + delay + duration);
}

const guzhengNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
let noteIndex = 0;

function playBackgroundMusic() {
    if (!musicPlaying) return;
    
    const note = guzhengNotes[noteIndex % guzhengNotes.length];
    playGuZhengNote(note, 2, 0);
    
    noteIndex++;
    musicInterval = setTimeout(playBackgroundMusic, 2000);
}

function toggleMusic() {
    if (musicPlaying) {
        musicPlaying = false;
        if (musicInterval) {
            clearTimeout(musicInterval);
            musicInterval = null;
        }
    } else {
        musicPlaying = true;
        playBackgroundMusic();
    }
    updateMusicUI();
}

function updateMusicUI() {
    document.getElementById('musicBadge').classList.toggle('playing', musicPlaying);
    document.getElementById('musicStatus').innerText = musicPlaying ? '播放中' : '已暂停';
}

document.addEventListener('click', function() {
    if (!audioContext) initAudio();
}, { once: true });

function triggerUpload() {
    document.getElementById('fileInput').click();
}

function handleUserUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        currentImageData = e.target.result;
        currentBuiltInId = null;
        onImageSelected(currentImageData, file.name.replace(/\.[^/.]+$/, ''));
    };
    reader.readAsDataURL(file);
}

function openLibrary() {
    const grid = document.getElementById('imageGrid');
    grid.innerHTML = builtInImages.map((img, idx) => `
        <div class="img-item" onclick="selectBuiltIn(${idx})" title="${img.name}">
            <img src="${img.url}" alt="${img.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span class="label">${img.name}</span>
        </div>
    `).join('');
    document.getElementById('modalOverlay').classList.add('active');
}
function closeLibrary() {
    document.getElementById('modalOverlay').classList.remove('active');
}
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeLibrary();
});

function selectBuiltIn(index) {
    const img = builtInImages[index];
    
    // 使用预设的地理位置
    currentLocation = img.location;
    
    // 更新地理位置输入框
    const locationInput = document.getElementById('locationInput');
    const locationStatus = document.getElementById('locationStatus');
    if (locationInput && locationStatus) {
        locationInput.value = img.location;
        locationStatus.innerHTML = '✅ 地理位置已设置（内置图片）';
    }
    
    currentBuiltInId = img.id;
    currentImageData = img.url;
    onImageSelected(img.url, img.name);
    closeLibrary();
}

function onImageSelected(imageSrc, name) {
    document.getElementById('previewArea').innerHTML = `<img src="${imageSrc}" alt="古建筑">`;
    document.getElementById('beforeImg').src = imageSrc; document.getElementById('beforeImg').style.display='block';
    document.getElementById('beforePlaceholder').style.display='none';
    isRestored = false; restoredImageData = null;
    document.getElementById('afterImg').style.display='none'; document.getElementById('afterPlaceholder').style.display='flex';
    document.getElementById('restoreBtn').disabled = false;

    document.getElementById('seasonImg').style.display='block';
    document.getElementById('seasonPlaceholder').style.display='none';
    document.getElementById('seasonImg').src = imageSrc;
    document.getElementById('seasonTip').style.display='none';
    document.getElementById('saveBtn').disabled = false;

    initChat(name);
}

async function startRestore() {
    if (!currentImageData) return;
    const btn = document.getElementById('restoreBtn');
    btn.disabled = true; btn.textContent = '<span class="loading-spinner"></span> 修复中...';
    
    setTimeout(() => {
        try {
            // 使用CSS滤镜实现图片增强，避免Canvas CORS问题
            const afterImg = document.getElementById('afterImg');
            const beforeImg = document.getElementById('beforeImg');
            
            // 创建一个新的图片元素，应用CSS滤镜
            afterImg.src = currentImageData;
            afterImg.style.display = 'block';
            afterImg.style.filter = 'brightness(1.05) contrast(1.15) saturate(1.2)';
            afterImg.style.webkitFilter = 'brightness(1.05) contrast(1.15) saturate(1.2)';
            
            document.getElementById('afterPlaceholder').style.display = 'none';
            isRestored = true;
            restoredImageData = currentImageData; // 保存原始图片
            btn.textContent = '✅ 修复完成';
        } catch (error) {
            console.error('Restore error:', error);
            btn.textContent = '❌ 修复失败';
            setTimeout(() => { btn.disabled = false; btn.textContent = '🎨 AI修复画质'; }, 2000);
        }
    }, 1500);
}

function enhanceImage(src) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = Math.min(1, 1200 / img.width);
            canvas.width = img.width * scale; canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // 尝试颜色增强，如果失败则跳过（CORS问题）
            try {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = imageData.data;
                for (let i = 0; i < d.length; i += 4) {
                    d[i] = Math.min(255, d[i] * 1.05 + 10);
                    d[i+1] = Math.min(255, d[i+1] * 1.05 + 10);
                    d[i+2] = Math.min(255, d[i+2] * 1.05 + 10);
                }
                ctx.putImageData(imageData, 0, 0);
                ctx.filter = 'contrast(1.15) saturate(1.2)';
                ctx.drawImage(canvas, 0, 0);
            } catch (error) {
                // CORS问题，跳过颜色增强
                console.log('CORS issue, skipping color enhancement');
            }
            
            resolve(canvas.toDataURL('image/jpeg', 0.95));
        };
        img.onerror = () => {
            // 如果加载失败，返回原始图片
            resolve(src);
        };
        img.src = src;
    });
}

async function urlToBase64(url) {
    try {
        // 对于本地图片，使用FileReader读取
        if (url.startsWith('image/')) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    try {
                        const dataURL = canvas.toDataURL('image/jpeg', 0.95);
                        resolve(dataURL);
                    } catch (error) {
                        reject(error);
                    }
                };
                img.onerror = function() {
                    reject(new Error('无法加载本地图片'));
                };
                img.src = url;
            });
        }
        
        // 对于网络图片，使用fetch
        const response = await fetch(url);
        const blob = await response.blob();
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(blob);
        });
    } catch (error) {
        console.error('Error converting URL to base64:', error);
        throw error;
    }
}

let currentLocation = null;

async function initChat(name) {
    const chat = document.getElementById('chatMessages');
    chat.innerHTML = '';
    addMessage('ai', '🔍 正在分析古建筑结构...');
    
    // 对于内置图片，使用预设的地理位置
    if (currentBuiltInId) {
        const img = builtInImages.find(i => i.id === currentBuiltInId);
        if (img && img.location) {
            currentLocation = img.location;
            // 更新地理位置输入框
            const locationInput = document.getElementById('locationInput');
            const locationStatus = document.getElementById('locationStatus');
            if (locationInput && locationStatus) {
                locationInput.value = img.location;
                locationStatus.innerHTML = '✅ 地理位置已设置（内置图片）';
            }
        }
    } else {
        // 对于上传的图片，分析地理位置
        currentLocation = await analyzeLocation(name);
    }
    
    try {
        // 对于内置图片，不发送图片给API（避免CORS问题）
        if (currentBuiltInId) {
            console.log('Using text-only mode for built-in image');
            const reply = await callChatAPI(`请专业分析${name}，包括年代、构造、特色。${currentLocation ? `该建筑位于${currentLocation}` : ''}`);
            chat.lastChild.remove();
            addMessage('ai', reply);
        } else {
            // 对于上传图片，发送图片给API
            let imageUrl = currentImageData;
            if (currentImageData.startsWith('data:')) {
                imageUrl = currentImageData;
            } else if (currentImageData.startsWith('image/')) {
                // 对于本地图片，转换为base64（上传图片不会进入这里）
                try {
                    imageUrl = await urlToBase64(currentImageData);
                    console.log('Converted local image to base64 for chat:', imageUrl.substring(0, 100) + '...');
                } catch (convertError) {
                    console.error('Error converting local image to base64:', convertError);
                }
            }
            
            console.log('Calling chat API with image:', imageUrl);
            const reply = await callChatAPI(`请专业分析这张古建筑图片，包括年代、构造、特色。${currentLocation ? `该建筑位于${currentLocation}` : ''}`, imageUrl);
            console.log('API reply:', reply);
            
            chat.lastChild.remove();
            addMessage('ai', reply);
        }
    } catch (error) {
        console.error('Init chat error:', error);
        addMessage('ai', getLocalInfo(name));
    }
}

// 分析图片中的地理位置
async function analyzeLocation(name) {
    try {
        let imageUrl = currentImageData;
        if (currentImageData.startsWith('data:')) {
            imageUrl = currentImageData;
        } else if (currentImageData.startsWith('image/')) {
            // 对于本地图片，转换为base64
            try {
                imageUrl = await urlToBase64(currentImageData);
                console.log('Converted local image to base64:', imageUrl.substring(0, 100) + '...');
            } catch (convertError) {
                console.error('Error converting local image to base64:', convertError);
                throw new Error('无法处理本地图片');
            }
        }
        
        const reply = await callChatAPI(`识别这张图片中的地理位置。请只返回地理位置信息，格式为：省份/城市/具体地点，例如：北京市东城区故宫。如果无法识别，请返回"未知"。图片内容：${name}`, imageUrl);
        console.log('Location analysis:', reply);
        
        // 更新界面显示
        const locationInput = document.getElementById('locationInput');
        const locationStatus = document.getElementById('locationStatus');
        
        if (reply && reply !== '未知') {
            currentLocation = reply;
            locationInput.value = reply;
            locationStatus.innerHTML = '✅ 地理位置识别成功';
        } else {
            currentLocation = null;
            locationInput.value = '';
            locationStatus.innerHTML = '❌ 无法识别地理位置，请手动输入';
        }
        
        return currentLocation;
    } catch (error) {
        console.error('Location analysis error:', error);
        
        // 更新界面显示错误
        const locationInput = document.getElementById('locationInput');
        const locationStatus = document.getElementById('locationStatus');
        locationInput.value = '';
        locationStatus.innerHTML = '❌ 地理位置识别失败，请手动输入';
        
        return null;
    }
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    addMessage('user', text);
    input.value = '';
    try {
        let imageUrl = currentImageData;
        if (currentImageData.startsWith('data:')) {
            imageUrl = currentImageData;
        }
        const reply = await callChatAPI(text, imageUrl);
        addMessage('ai', reply);
    } catch {
        addMessage('ai', '⚠️ 网络问题，请稍后重试。');
    }
}
async function callChatAPI(msg, imageUrl = null) {
    try {
        const payload = {
            model: document.getElementById('chatModelName').value,
            messages: [
                {
                    role: 'user',
                    content: []
                }
            ]
        };
        
        if (imageUrl) {
            payload.messages[0].content.push({
                type: 'image_url',
                image_url: {
                    url: imageUrl
                }
            });
        }
        
        payload.messages[0].content.push({
            type: 'text',
            text: msg
        });
        
        console.log('API Payload:', payload);
        
        const res = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${ARK_API_KEY}`
            },
            body: JSON.stringify(payload)
        });
        
        if (!res.ok) {
            throw new Error(`HTTP ${res.status}: ${await res.text()}`);
        }
        
        const json = await res.json();
        console.log('API Response:', json);
        
        if (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) {
            return json.choices[0].message.content;
        }
        
        throw new Error('Invalid response format');
    } catch (error) {
        console.error('Chat API error:', error);
        throw error;
    }
}
function addMessage(type, text) {
    const chat = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = `chat-msg ${type}`;
    
    // 优化文本显示，处理特殊格式
    let formattedText = text
        .replace(/\n/g, '<br>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    
    div.innerHTML = `<div style="font-size:10px;opacity:0.7;">${type==='ai'?'🤖 AI':'👤 您'}</div><div style="line-height:1.7;">${formattedText}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}
